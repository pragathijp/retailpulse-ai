name: 'retailpulse'
version: '1.0.0'
config-version: 2

profile: 'retailpulse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  dedupe_exact_rows: true
  rfm_reference_date_offset_days: 1
  processed_dir: '../data/processed'

models:
  retailpulse:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table