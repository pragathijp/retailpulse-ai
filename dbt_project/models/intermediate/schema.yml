version: 2

models:
  - name: int_orders
    description: "Aggregated order-level transactions with line item count, order totals, and return status."
    columns:
      - name: invoice_no
        description: "Unique invoice identifier."
        tests:
          - not_null
      - name: order_ts
        description: "Order timestamp."
        tests:
          - not_null
