version: 2

models:
  - name: fct_orders
    description: "Fact table containing order-level financial metrics."
    columns:
      - name: invoice_no
        description: "Primary key for orders."
        tests:
          - not_null
  - name: dim_customers
    description: "Dimension table summarizing customer lifetime RFM performance."
    columns:
      - name: customer_id
        description: "Unique customer identifier."
        tests:
          - unique
          - not_null
