version: 2

sources:
  - name: raw
    database: retail_analytics
    schema: raw
    tables:
      - name: retail_transactions
        description: "Raw 2-year transactional data from UCI Online Retail II dataset."

models:
  - name: stg_retail_transactions
    description: "Typed, trimmed staging transactions with surrogate line key and exact-row deduplication."
    columns:
      - name: transaction_line_key
        description: "md5 of the base key (invoice_no, stock_code, invoice_ts, quantity) plus line_seq, unique per line."
        data_tests:
          - not_null
          - unique
      - name: invoice_no
        description: "Invoice identifier."
        data_tests:
          - not_null
      - name: stock_code
        description: "Stock keep unit code."
        data_tests:
          - not_null
      - name: quantity
        description: "Item quantity."
        data_tests:
          - not_null
      - name: unit_price
        description: "Price per unit."
        data_tests:
          - not_null
      - name: invoice_ts
        description: "Timestamp of order placement."
        data_tests:
          - not_null
      - name: country
        description: "Customer country; Unknown when missing."
        data_tests:
          - not_null
